name: KSM E2E

# The KSM scenarios live in their own repository and run this build through
# their pipeline. They need no credentials -- every scenario uses
# selfManagement on one k0s node in Docker -- so unlike the provider e2e this
# runs on the ordinary pull_request trigger, with no secrets and no approval
# gate. That is the point: a label or an approval only catches what someone
# already suspected, and the regressions worth catching here are the ones
# nobody did.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - 'release-*'
    # Sources that can affect KSM behavior. A change outside these paths can
    # still be run by hand with the dispatch below.
    paths:
      - 'internal/controller/**'
      - 'internal/serviceset/**'
      - 'internal/util/**'
      - 'internal/webhook/**'
      - 'api/v1beta1/**'
      - 'cmd/**'
      - 'templates/provider/**'
      - '.github/workflows/ksm-e2e.yml'
      - 'go.mod' # deps updates could change KSM behavior
      - 'go.sum'
      # Last, since a later pattern wins: nothing a scenario reaches.
      - '!templates/provider/cluster-api-provider-*/**'
      - '!internal/controller/backup/**'
      - '!internal/controller/management_backup_controller.go'
      - '!internal/controller/accessmanagement_*.go'

  # Nightly on main: the paths filter above only sees what a pull request
  # touches, and a scenario can break from something it does not list -- a
  # merge of two green branches, or the ksm-tests tag we pin. Every scenario,
  # against whatever main is at the time.
  schedule:
    - cron: '21 3 * * 1-5' # 03:21 UTC; Mon-Fri

  workflow_dispatch:
    inputs:
      ref:
        description: 'KCM ref to build (branch, tag or sha; empty = this branch)'
        required: false
        default: ''
      scenarios:
        description: 'Scenario ids, comma separated (empty = all)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ksm-e2e-${{ github.head_ref || github.ref_name }}-${{ inputs.ref || '' }}-${{ inputs.scenarios || '' }}
  cancel-in-progress: true

jobs:
  ksm:
    name: KSM Self
    # Pinned, not floating: the scenarios live in another repository, and on main
    # a change there would turn this red with nothing in this repository to
    # explain it. Bumping the tag is a pull request like any other.
    uses: k0rdent/ksm-tests/.github/workflows/e2e.yml@v1.5.1
    with:
      # The same ref as the uses: line above. A called workflow cannot discover
      # the ref it was reached at -- no context exposes it -- so it has to be
      # told, or it checks this repository out in place of its own.
      ksm_ref: v1.5.1
      # The head commit, not the ref: a branch moves, and the run should say
      # exactly what it tested. head.repo is the fork on a fork pull request,
      # and the caller's own repository for a manual run.
      KCM: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      KCM_MODE: source
      SRC_URL: ${{ github.event.pull_request.head.repo.clone_url || format('{0}/{1}.git', github.server_url, github.repository) }}
      # Empty means every scenario. Picking a subset would be the same guess as
      # a label -- it assumes we know which of them a change can break, and
      # #3080 is what happens when that assumption is wrong. They run in
      # parallel, so all of them cost about as long as any one of them.
      scenarios: ${{ inputs.scenarios }}

  # The same pipeline on adopted clusters in place of self-managed ones.
  ksm-adopted:
    name: KSM Adopted
    needs: ksm
    # Only run on schedule event not to overwhelm PR checks
    if: github.event_name == 'schedule'
    # The same tag as the job above, for the same reason.
    uses: k0rdent/ksm-tests/.github/workflows/e2e.yml@v1.5.1
    with:
      # The same ref as the uses: line, for the reason the job above gives.
      ksm_ref: v1.5.1
      KCM: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      KCM_MODE: source
      TEST_MODE: adopted
      SRC_URL: ${{ format('{0}/{1}.git', github.server_url, github.repository) }}
      scenarios: ${{ inputs.scenarios }}
