configSecret: # @schema type: object; description: Configuration for the Secret that provides controller configuration variables
  create: false # @schema type: boolean; description: Specifies whether the configuration Secret should be created by this chart
  name: "" # @schema type: string; description: Name of the configuration Secret
  namespace: "" # @schema type: string; description: Namespace of the configuration Secret

config: {} # @schema type: object; description: Key-value configuration data stored in the configuration Secret. Only used when configSecret.create is true

infrastructure: # @schema type: object; description: Infrastructure provider configuration
  manager: {} # @schema type: object; description: Controller manager settings of the infrastructure provider, such as feature gates, verbosity and other options
  deployment: {} # @schema type: object; description: Deployment-level overrides for the infrastructure provider controller, including replicas, containers, and scheduling settings
  patches: [] # @schema type: array; item: object; description: Optional CAPI Operator spec.patches list for the infrastructure provider.

bootstrap: # @schema type: object; description: Bootstrap provider configuration
  manager: {} # @schema type: object; description: Controller manager settings of the bootstrap provider, such as feature gates, verbosity and other options
  deployment: {} # @schema type: object; description: Deployment-level overrides for the bootstrap provider controller, including replicas, containers, and scheduling settings
  patches: [] # @schema type: array; item: object; description: Optional CAPI Operator spec.patches list for the bootstrap provider.

controlPlane: # @schema type: object; description: ControlPlane provider configuration
  manager: {} # @schema type: object; description: Controller manager settings of the controlplane provider, such as feature gates, verbosity and other options
  deployment: {} # @schema type: object; description: Deployment-level overrides for the controlplane provider controller, including replicas, containers, and scheduling settings
  patches: [] # @schema type: array; item: object; description: Optional CAPI Operator spec.patches list for the controlplane provider.

proxy: # @schema type: object; description: Proxy settings of the controller; additionalProperties: false
  enabled: true # @schema type: boolean; description: Enable proxy

inPlaceUpdates: # @schema type: object; description: Cluster API in-place updates settings (experimental). Requires inPlaceUpdates.enabled in the cluster-api provider as well, the release fails if spec.manager.featureGates of the cluster-api CoreProvider lacks the InPlaceUpdates and RuntimeSDK gates (gates set by other means are not recognized); additionalProperties: false
  enabled: null # @schema type: [boolean, null]; description: Enable the InPlaceUpdates feature gate of the controlplane provider. Defaults to global.enableInPlaceUpdates if unset. Explicitly set controlPlane.manager.featureGates take precedence. The extension webhook is deployed whenever the resulting gate is enabled. Disabling removes the webhook, so do it only when no clusters use the InPlace update strategy or are being updated
  extension: # @schema type: object; description: Extension webhook server settings; additionalProperties: false
    image: # @schema type: object; description: Extension webhook server image; additionalProperties: false
      repository: "" # @schema type: string; description: Image repository. Defaults to <global.registry>/capi/k0smotron if global.registry is set, otherwise to quay.io/k0sproject/k0smotron
      tag: "" # @schema type: string; description: Image tag. Defaults to the chart appVersion
      pullPolicy: IfNotPresent # @schema type: string; enum: [Always, IfNotPresent, Never]; description: Image pull policy
    replicas: 1 # @schema type: integer; minimum: 0; description: Number of extension webhook server replicas
    resources: {} # @schema type: object; description: Resources of the extension webhook server container
    nodeSelector: {} # @schema type: object; description: Node selector of the extension webhook server pods
    tolerations: [] # @schema type: array; item: object; description: Tolerations of the extension webhook server pods
    affinity: {} # @schema type: object; description: Affinity of the extension webhook server pods
