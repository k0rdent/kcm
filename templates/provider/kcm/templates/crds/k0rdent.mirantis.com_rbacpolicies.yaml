---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    helm.sh/resource-policy: keep
  name: rbacpolicies.k0rdent.mirantis.com
spec:
  group: k0rdent.mirantis.com
  names:
    kind: RBACPolicy
    listKind: RBACPolicyList
    plural: rbacpolicies
    shortNames:
      - rbacpol
    singular: rbacpolicy
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - description: Age
          jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1beta1
      schema:
        openAPIV3Schema:
          description: |-
            RBACPolicy is the Schema for the rbacpolicies API.

            It is the role catalog for exactly one [ClusterDeployment]: a ClusterDeployment opts in by
            setting spec.rbacPolicy to the name of an RBACPolicy in its own namespace. For each entry in
            spec.bindings, the RBAC operator creates/updates a "k0rdent-<name>" ClusterRoleBinding in the
            child cluster, using the kubeconfig generated by Cluster API.
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                RBACPolicySpec defines the role catalog: a set of ClusterRole -> subjects bindings that the RBAC
                operator reconciles into the child cluster of the [ClusterDeployment] that references this
                RBACPolicy via spec.rbacPolicy and has spec.clusterAuth set.
              properties:
                bindings:
                  description: |-
                    Bindings is the role catalog: each entry maps one ClusterRole to a set of subjects,
                    materialized as a ClusterRoleBinding in the child cluster of the referencing ClusterDeployment.
                  items:
                    description: |-
                      RBACPolicyBinding maps a single Kubernetes ClusterRole to the exact set of ClusterRoleBinding
                      subjects that should be bound to it in the targeted child cluster.
                    properties:
                      clusterRole:
                        description: |-
                          ClusterRole is the name of the Kubernetes ClusterRole that Name is bound to in the child
                          cluster. It may be a built-in ClusterRole (e.g. "admin", "edit", "view") or a custom one,
                          either already present in the child cluster or defined inline via Rules.
                        minLength: 1
                        type: string
                      name:
                        description: |-
                          Name identifies this binding within the policy (for example "compute-admin"). It is used to
                          name the generated ClusterRoleBinding ("k0rdent-<name>").
                        minLength: 1
                        type: string
                      rules:
                        description: |-
                          Rules optionally supplies the PolicyRules for the ClusterRole named by ClusterRole, for the case
                          where that ClusterRole does not already exist in the child cluster (e.g. a custom role). When
                          set, the operator creates/updates that ClusterRole (with these rules) alongside the
                          ClusterRoleBinding. Leave unset to bind to a ClusterRole that is expected to already exist
                          (e.g. a built-in role) — the operator never modifies a ClusterRole it did not create.
                        items:
                          description: |-
                            PolicyRule holds information that describes a policy rule, but does not contain information
                            about who the rule applies to or which namespace the rule applies to.
                          properties:
                            apiGroups:
                              description: |-
                                APIGroups is the name of the APIGroup that contains the resources.  If multiple API groups are specified, any action requested against one of
                                the enumerated resources in any API group will be allowed. "" represents the core API group and "*" represents all API groups.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                            nonResourceURLs:
                              description: |-
                                NonResourceURLs is a set of partial urls that a user should have access to.  *s are allowed, but only as the full, final step in the path
                                Since non-resource URLs are not namespaced, this field is only applicable for ClusterRoles referenced from a ClusterRoleBinding.
                                Rules can either apply to API resources (such as "pods" or "secrets") or non-resource URL paths (such as "/api"),  but not both.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                            resourceNames:
                              description: ResourceNames is an optional white list of names that the rule applies to.  An empty set means that everything is allowed.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                            resources:
                              description: Resources is a list of resources this rule applies to. '*' represents all resources.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                            verbs:
                              description: Verbs is a list of Verbs that apply to ALL the ResourceKinds contained in this rule. '*' represents all verbs.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                            - verbs
                          type: object
                        type: array
                      subjects:
                        description: Subjects is the ClusterRoleBinding subject list for this binding. See RBACPolicySubject.
                        items:
                          description: |-
                            RBACPolicySubject names one ClusterRoleBinding subject.

                            RBACPolicy makes no assumption about how (or whether) the child cluster's authentication is
                            configured: Name is written verbatim by the author to match whatever that specific setup
                            actually asserts (a ClusterAuthentication's JWT claim mapping, some other identity provider, or
                            none at all) — for example "k0rdent:project:project-2:compute-admin".
                          properties:
                            kind:
                              description: 'Kind is the Kubernetes RBAC subject kind: "User" or "Group".'
                              enum:
                                - User
                                - Group
                              type: string
                            name:
                              description: Name is the exact subject name (see the RBACPolicySubject doc comment).
                              minLength: 1
                              type: string
                          required:
                            - kind
                            - name
                          type: object
                        minItems: 1
                        type: array
                    required:
                      - clusterRole
                      - name
                      - subjects
                    type: object
                  maxItems: 200
                  minItems: 1
                  type: array
              required:
                - bindings
              type: object
          type: object
      served: true
      storage: true
      subresources: {}
