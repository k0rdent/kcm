                        type: string
                    required:
                      - name
                    type: object
                  minItems: 0
                  type: array
                  x-kubernetes-list-type: atomic
              type: object
              x-kubernetes-validations:
                - message: exactly one of kubeConfig or clusterDeployment must be set
                  rule: has(self.kubeConfig) != has(self.clusterDeployment)
            status:
              allOf:
                - minProperties: 1
                - minProperties: 1
              description: status describes the observed state
              properties:
                availableProviders:
                  description: availableProviders holds all available CAPI providers.
                  items:
                    type: string
                  type: array
                  x-kubernetes-list-type: atomic
                capiContracts:
                  additionalProperties:
                    additionalProperties:
                      type: string
                    description: |-
                      CompatibilityContracts holds key-value pairs with compatibility [contract versions],
                      where the key is the core CAPI contract version,
                      and the value is an underscore-delimited (_) list of provider contract versions
                      supported by the core CAPI.

                      [contract versions]: https://cluster-api.sigs.k8s.io/developer/providers/contracts
                    minProperties: 0
                    type: object
                  description: |-
                    capiContracts holds compatibility [contract versions] for each CAPI provider
                    in a key-value pairs, where the key is the core CAPI contract version,
                    and the value is an underscore-delimited (_) list of provider contract versions
                    supported by the core CAPI.

                    [contract versions]: https://cluster-api.sigs.k8s.io/developer/providers/contracts
                  minProperties: 0
                  type: object
                components:
                  additionalProperties:
                    description: ComponentStatus is the status of Management component installation
                    properties:
                      error:
                        description: error stores as error message in case of failed installation
                        minLength: 1
                        type: string
                      exposedProviders:
                        description: exposedProviders is a list of CAPI providers this component exposes
                        items:
                          type: string
                        type: array
                        x-kubernetes-list-type: atomic
                      success:
                        description: success represents if a component installation was successful
                        type: boolean
                      template:
                        description: template is the name of the Template associated with this component.
                        minLength: 1
                        type: string
                    type: object
                  description: components indicates the status of installed KCM components and CAPI providers.
                  minProperties: 0
                  type: object
                conditions:
                  description: conditions represents the observations of a Region's current state.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  minItems: 0
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                observedGeneration:
                  description: observedGeneration is the last observed generation.
                  format: int64
                  minimum: 1
                  type: integer
              type: object
          type: object
      served: true
      storage: true
      subresources:
        status: {}
